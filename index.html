    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;

            text-align: center;
            margin: 0;
        }
        .message {
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="message">
        <h2>Mengarahkan ke TLIBRARY ID...</h2>
