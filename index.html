<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLIBRARY ID</title>
    <style>
        /* Menghilangkan margin dan padding bawaan agar iframe bisa full screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Menyembunyikan scrollbar ganda dari body */
            background-color: #f4f4f4;
        }
        
        /* Mengatur iframe agar memenuhi seluruh layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Menghilangkan garis tepi iframe */
            display: block;
        }
    </style>
</head>
<body>

    <!-- Iframe yang mengarah ke website tujuan -->
    <iframe src="https://id.welib.org" title="TLIBRARY ID" allowfullscreen></iframe>

</body>
</html>
