<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TLIBRARY ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; 
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header Kustom -->
    <header class="bg-[#1e293b] text-white flex justify-between items-center px-4 py-3 shadow-md z-10 shrink-0 h-[60px]">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
            </svg>
            <h1 class="text-xl font-bold tracking-wide">TLIBRARY <span class="text-indigo-400">ID</span></h1>
        </div>
        <button id="installBtn" class="hidden bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold py-1.5 px-4 rounded-full transition-colors shadow-sm">
            Instal Aplikasi
        </button>
    </header>

    <!-- Kontainer Iframe -->
    <main class="flex-1 w-full relative overflow-hidden bg-white">
        <!-- 
          src diubah ke "/proxy-home" agar melewati vercel.json.
          Atribut sandbox dihilangkan agar skrip internal web asli tetap jalan.
        -->
        <iframe 
            id="welibIframe"
            src="/proxy-home" 
            class="w-full absolute left-0" 
            style="top: -85px; height: calc(100% + 85px); border: none;"
            title="TLibrary Digital">
        </iframe>
    </main>

    <!-- PWA & Install Button Script -->
    <script>
        const manifestData = {
            name: "TLIBRARY ID",
            short_name: "TLIBRARY",
            start_url: ".",
            display: "standalone",
            background_color: "#1e293b",
            theme_color: "#1e293b",
            icons: [{
                src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231e293b"/><text x="50" y="65" font-family="Arial" font-size="40" font-weight="bold" fill="white" text-anchor="middle">TL</text></svg>',
                sizes: "512x512",
                type: "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);

        const swCode = `
            self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).catch(console.error);
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });
    </script>

    <!-- SCRIPT PENJINAK IFRAME (Bisa jalan karena Same-Origin via Vercel) -->
    <script>
        const iframe = document.getElementById('welibIframe');

        // Fungsi ini akan berjalan setiap kali iframe memuat halaman baru
        iframe.onload = function() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                // Cari seluruh link (tautan) dan tombol di dalam website
                const links = iframeDoc.querySelectorAll('a, form');
                
                links.forEach(link => {
                    // 1. Hapus paksaan buka di tab baru atau paksaan keluar layar utama
                    const target = link.getAttribute('target');
                    if (target === '_top' || target === '_blank') {
                        link.setAttribute('target', '_self');
                    }
                    
                    // 2. Jika ada link yang masih memakai domain aslinya secara absolut, 
                    // ubah menjadi relatif agar tetap masuk ke proxy Vercel kita
                    if (link.href && link.href.includes('id.welib.org')) {
                        link.href = link.href.replace('https://id.welib.org', '');
                    }
                });
                
            } catch (error) {
                console.log("Menunggu render halaman...");
            }
        };
    </script>
</body>
</html>
